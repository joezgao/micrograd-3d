<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Watch a tiny neural network learn in 3D: micrograd in TypeScript, edges glow by gradient size." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>micrograd 3D</title>
    <!-- Link previews (X, iMessage, Slack). Crawlers need absolute URLs; og.png is a 1200x630 crop of docs/screenshot.png. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joezgao.github.io/micrograd-3d/" />
    <meta property="og:title" content="micrograd 3D" />
    <meta property="og:description" content="Watch a tiny neural network learn in 3D: micrograd in TypeScript, edges glow by gradient size." />
    <meta property="og:image" content="https://joezgao.github.io/micrograd-3d/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A small neural network drawn in 3D on black; the weights whose gradients this backward step computes glow amber." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Static first frame: painted before the JS bundle arrives, replaced by React on first render.
         Kept identical to App.tsx by src/shell.test.ts. -->
    <div id="root"><main class="app">
      <header class="head">
        <h1>micrograd 3D</h1>
        <p class="lede">A tiny neural network learning two moons. Every line is a weight; the brighter it glows, the larger the gradient backprop just sent through it.</p>
      </header>
      <section class="stage" aria-label="Network"><p class="stage-note mono">preparing the 3D view…</p></section>
    </main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
